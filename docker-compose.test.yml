services:
  postgres-test:
    image: postgres:16-alpine
    container_name: users-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${TEST_DB_NAME:-users_db_test}
    ports:
      - '${TEST_DB_PORT:-5434}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 2s
      timeout: 3s
      retries: 30

  e2e:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "npm test"
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      TEST_DB_HOST: postgres-test
      TEST_DB_PORT: 5432
      TEST_DB_NAME: ${TEST_DB_NAME:-users_db_test}
      POKEMON_API_BASE_URL: ${POKEMON_API_BASE_URL:-https://pokeapi.co/api/v2/pokemon}