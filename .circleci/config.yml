version: 2.1

orbs:
  node: circleci/node@5.2

jobs:
  test:
    # machine executor gives us Docker + Docker Compose, needed to run up_test.sh
    # the same way it's documented to run locally (fully containerized e2e + postgres-test).
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Run e2e tests (dockerized Postgres, via up_test.sh)
          command: |
            chmod +x ./up_test.sh
            ./up_test.sh
      # up_test.sh runs jest with --coverage and mounts ./coverage out of the e2e container.
      # Requires COVERALLS_REPO_TOKEN set in the CircleCI project's environment variables.
      # Uses Coveralls' Universal Coverage Reporter directly rather than the coveralls orb,
      # since the org doesn't allow uncertified public orbs.
      - run:
          name: Upload coverage to Coveralls
          command: |
            curl -sL https://coveralls.io/coveralls-linux.tar.gz | tar -xz
            ./coveralls report ./coverage/lcov.info
  build:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          command: npm run build
          name: Build app
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

workflows:
  build_test_deploy:
    jobs:
      - test
      - build
