#Generate code circle ci configuration file
version: 2.1
orbs:
  node: circleci/node@5.0.2
jobs:
  test:
    # machine executor gives us Docker + Docker Compose, needed to run up_test.sh
    # the same way it's documented to run locally (fully containerized e2e + postgres-test).
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Run e2e tests (dockerized Postgres, via up_test.sh)
          command: |
            chmod +x ./up_test.sh
            ./up_test.sh
  build:
    executor: node/default # use the default executor defined within the orb
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          command: npm run build
          name: Build app
      - persist_to_workspace:
          root: ~/project
          paths:
            - .
workflows:
  build_test_deploy: # this can be any name you choose
    jobs:
      - test
      - build